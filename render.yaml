# Render blueprint: the API as a Node web service and the web app as a static
# site. The browser calls the API on its own domain: the web app is built with
# VITE_API_BASE_URL pointing at it, and the API allows the web app's origin
# through ALLOWED_ORIGINS (CORS). A static-site rewrite of /api/* to the API
# was tried first, but Render answered those proxied requests with 401
# "missing Authorization header" before they reached the API.
#
# DATABASE_URL is entered in the Render dashboard (sync: false), never
# committed: use Neon's *pooled* connection string for the running API.
# Migrations and the seed are run separately against Neon's *direct* URL.

services:
  - type: web
    name: acme-salary-api
    runtime: node
    plan: free
    # The API loads `shared` from its built dist at runtime, so build it first
    # (as CI does). --include=dev: TypeScript is a dev dependency.
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build:api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      # The deployed web app's origin (comma-separate to allow more).
      - key: ALLOWED_ORIGINS
        value: https://acme-salary-web-nv6c.onrender.com

  - type: web
    name: acme-salary-web
    runtime: static
    # Vite bundles `shared` from source, so no build:shared is needed here.
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Baked into the bundle at build time: the API's actual Render hostname.
      - key: VITE_API_BASE_URL
        value: https://acme-salary-api-jqzf.onrender.com
    routes:
      # Single-page app: serve index.html for client routes so deep links like
      # /employees/42 survive a reload.
      - type: rewrite
        source: /*
        destination: /index.html
