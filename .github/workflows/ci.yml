name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The API consumes `shared` through its built dist (gitignored), so it
      # must exist before typecheck, tests and the API build.
      - run: npm run build:shared

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
